name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ===== 1. 构建 Android APK =====
  #
  # 说明：原 `analyze-and-test` job 已取消。
  # 如需恢复静态检查 / 单元测试 / dart format 自动提交，
  # 重新加回 `analyze-and-test` job 并让 `build-android` `needs` 依赖它即可。
  #
  # 关键设计（强制更新机制）：
  # 仅在 push 到 main 分支时，本 job 内部计算下一个 tag（v{YYYY.MMDD.N}），
  # 并用 sed 把 tag（去掉 v 前缀）注入到 lib/core/constants/app_constants.dart
  # 的 appVersion 字段。这样：
  #   - CI 构建的 APK 内部 AppConstants.appVersion = "2026.0720.0"
  #   - 用户安装此 APK 后，启动时 GitHubReleaseService.checkForUpdate 比较
  #     AppConstants.appVersion 与 latest release.tagName（去掉 v 前缀）
  #   - 相同 → 跳过更新；不同（latest 更大）→ 弹强制更新对话框
  #   - 避免了"已安装最新版本但仍提示有新版本"的问题
  #
  # tag 通过 job outputs 传给下游 auto-release job 创建 GitHub Release。
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      next_tag: ${{ steps.tag.outputs.next_tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout (full history for tag listing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          channel: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Compute next tag (only on main push)
        #
        # 仅在 push 到 main 时计算 tag，并注入到 AppConstants.appVersion。
        # PR / develop 分支不计算 tag，appVersion 保持原值（用于本地调试）。
        # 格式：v{YYYY.MMDD.N}
        #   - 当天首次构建 → v2026.0720.0
        #   - 当天后续构建 → v2026.0720.1, v2026.0720.2 ...
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tag
        run: |
          DATE=$(date -u +'%Y.%m%d')
          BASE="v${DATE}"
          # 列出当天已有的所有 tag，取最大编号 +1
          EXISTING=$(git tag -l "${BASE}.*" | sort -V | tail -n 1)
          if [ -z "$EXISTING" ]; then
            NEXT="${BASE}.0"
          else
            N=$(echo "$EXISTING" | awk -F. '{print $NF}')
            NEXT="${BASE}.$((N+1))"
          fi
          # version 是去掉 v 前缀的纯数字版本号（用于注入 AppConstants.appVersion）
          VERSION="${NEXT#v}"
          echo "next_tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed next tag: $NEXT (version: $VERSION)"

      - name: Inject appVersion into AppConstants (only on main push)
        #
        # 用 sed 把 lib/core/constants/app_constants.dart 中的
        # `static const String appVersion = '...';` 替换为
        # `static const String appVersion = '2026.0720.0';`
        #
        # 这样 App 启动时比较 AppConstants.appVersion 与 latest release.tagName，
        # 如果相同就跳过更新，避免"已安装最新版本但仍提示有新版本"的问题。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          echo "Injecting appVersion = '$VERSION' into lib/core/constants/app_constants.dart"
          sed -i "s|static const String appVersion = '[^']*';|static const String appVersion = '${VERSION}';|" lib/core/constants/app_constants.dart
          echo "--- AppConstants.appVersion after injection ---"
          grep "appVersion" lib/core/constants/app_constants.dart

      - name: Generate native platform scaffolding (android only)
        #
        # 关键：保留 --project-name=videohub 与 --org com.videohub 不变
        # 这样生成的 Android applicationId 仍是 com.videohub.videohub，
        # 老用户可以平滑升级（不变更包名 = 不丢数据）。
        # Dart 包名已改为 yellow_depot（见 pubspec.yaml），与 Android 包名独立。
        #
        # 1. launcher 显示名 sed 改为 "Yellow Depot"
        # 2. 注入 REQUEST_INSTALL_PACKAGES 权限（自动更新功能需要）
        # 3. 注入 PiP（画中画）支持：Manifest 属性 + 覆盖 MainActivity.kt
        #    （MethodChannel "pip_channel" 桥接，播放页切后台自动进小窗）
        run: |
          flutter create --platforms=android --project-name=videohub --org com.videohub .
          sed -i 's|android:label="videohub"|android:label="Yellow Depot"|' android/app/src/main/AndroidManifest.xml

          # 在 </manifest> 前注入权限
          # INTERNET：Flutter 模板仅把 INTERNET 放在 src/debug/ 的 Manifest，
          #   release 构建不合并 → 无网络权限 → 所有请求失败（含 GitHub 更新检查）
          # REQUEST_INSTALL_PACKAGES：自动更新安装 APK（Android 8+ 必需）
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

          # 明文 HTTP 许可：源站 baseUrl 为 http://（Android 9+ 默认禁明文），
          # 同样只在 debug Manifest 提供，release 需显式声明
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

          # PiP：activity 声明支持画中画
          # 注意：flutter create 模板的 activity 已自带
          # android:configChanges="orientation|keyboardHidden|keyboard|screenSize|
          # smallestScreenSize|screenLayout|uiMode"（含 PiP 所需项），仅注入本属性，
          # 重复注入 configChanges 会造成 XML 属性冲突导致 Manifest 解析失败
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:supportsPictureInPicture="true"|' android/app/src/main/AndroidManifest.xml

          # PiP：覆盖 MainActivity.kt（onUserLeaveHint 自动进小窗 + 状态回传 Flutter）
          cat > android/app/src/main/kotlin/com/videohub/videohub/MainActivity.kt << 'KOTLIN_EOF'
          package com.videohub.videohub

          import android.app.PictureInPictureParams
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import kotlin.math.roundToInt

          /// 画中画（PiP）桥接 Activity
          ///
          /// MethodChannel "pip_channel" 协议：
          /// - setPipEnabled {enabled, aspectRatio}：Flutter 播放页启停自动 PiP
          /// - enterPip：主动进入（预留）
          /// - onPipChanged {bool}：进入/退出小窗时反向通知 Flutter 切布局
          class MainActivity : FlutterActivity() {
              private var pipEnabled = false
              private var pipAspect = 16f / 9f

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "pip_channel")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "setPipEnabled" -> {
                                  pipEnabled = call.argument<Boolean>("enabled") ?: false
                                  val ratio = call.argument<Double>("aspectRatio")
                                  if (ratio != null && ratio > 0) {
                                      pipAspect = ratio.toFloat()
                                  }
                                  result.success(null)
                              }
                              "enterPip" -> {
                                  result.success(enterPipMode())
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun enterPipMode(): Boolean {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return false
                  return try {
                      // clamp 到系统允许范围（约 0.42 ~ 2.38），千分比近似分数
                      val clamped = pipAspect.coerceIn(0.42f, 2.38f)
                      val num = (clamped * 1000f).roundToInt()
                      val params = PictureInPictureParams.Builder()
                          .setAspectRatio(Rational(num, 1000))
                          .build()
                      enterPictureInPictureMode(params)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  // 用户按 Home / 切后台：播放页已启用 → 进小窗继续播放
                  if (pipEnabled) {
                      enterPipMode()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode)
                  flutterEngine?.dartExecutor?.binaryMessenger?.let { messenger ->
                      MethodChannel(messenger, "pip_channel")
                          .invokeMethod("onPipChanged", isInPictureInPictureMode)
                  }
              }
          }
          KOTLIN_EOF

          grep -E 'android:label=|INTERNET|REQUEST_INSTALL_PACKAGES|usesCleartextTraffic|supportsPictureInPicture' android/app/src/main/AndroidManifest.xml

      - name: Bump Kotlin to 1.9.22 for plugin compatibility
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "1\.[0-9]\+\.[0-9]\+"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          grep kotlin android/settings.gradle

      - name: Bump AGP to 8.6.1 + Gradle to 8.9 (android-35 aapt2 support)
        #
        # 部分新版本插件（如 flutter_plugin_android_lifecycle）声明 compileSdk 35，
        # Flutter 3.24 模板的 AGP 8.1 aapt2 无法解析 android-35 资源表
        # （RES_TABLE_TYPE_TYPE entry offsets overlap），release 构建的
        # verifyReleaseResources 任务必失败（debug 不走该任务所以此前未暴露）。
        # 解法：升级 AGP（其 aapt2 原生支持 android-35）+ 配套 Gradle wrapper。
        # （曾尝试 subprojects afterEvaluate 强锁 compileSdk 34，但模板的
        #  evaluationDependsOn(':app') 会使子项目提前评估完毕导致钩子报错。）
        run: |
          sed -i 's|com.android.application" version "[0-9.]*"|com.android.application" version "8.6.1"|' android/settings.gradle
          grep 'com.android.application' android/settings.gradle
          sed -i 's|gradle-[0-9.]*-[a-z]*\.zip|gradle-8.9-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          # 校验：若未命中（模板版本格式变化）则直接失败，避免静默未生效
          grep -q 'version "8.6.1"' android/settings.gradle
          grep -q 'gradle-8.9' android/gradle/wrapper/gradle-wrapper.properties

      - name: Run Floor codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (arm64-v8a release, AOT + obfuscate)
        #
        # release 构建（此前为 debug，包体 54MB）：
        # - AOT 编译：体积约减半（54MB → ~20MB），运行性能更好
        # - --obfuscate：Dart 符号混淆，进一步减小体积并防逆向
        # - 签名：Flutter 模板 release 块默认 signingConfig = debug keystore，
        #   与历史 debug 构建同签名（GitHub runner 镜像预置 debug.keystore），
        #   老用户可直接覆盖安装，升级路径不变
        # - 更新链路不受影响：App 按 assets[].name 以 ".apk" 后缀匹配
        run: |
          # 防御：若模板 release 签名行为注释状态则打开（默认模板已启用，无变化）
          sed -i 's|// signingConfig = signingConfigs.debug|signingConfig = signingConfigs.debug|' android/app/build.gradle || true
          grep -n "signingConfig" android/app/build.gradle || true
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --obfuscate --split-debug-info=/tmp/symbols

      - name: Verify produced APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
          if-no-files-found: error

  # ===== 2. Release 构建（手动 push v* tag 时自动发布）=====
  #
  # 此 job 处理手动 push tag（如 git tag v1.2.3 && git push origin v1.2.3）的场景，
  # 与 auto-release job（push 到 main 自动打 tag）互不影响。
  release:
    name: Release (manual tag)
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/android/*.apk
          body: |
            ## Yellow Depot ${{ github.ref_name }}

            ### 📦 Downloads
            - **Android APK**: `app-arm64-v8a-release.apk`（见下方附件）

            ### ✅ CI 状态
            - Android 构建: ${{ needs.build-android.result }}

            ### 📝 说明
            由 GitHub Actions 自动构建发布。

  # ===== 3. Auto Release（push 到 main 自动打 tag + 发 Release）=====
  #
  # 触发条件：仅 push 到 main 分支时执行。
  # 流程：
  #   1. 等待 build-android 完成（build-android 已计算 tag 并注入到 APK）
  #   2. 使用 build-android 输出的 tag 创建 GitHub Release（含 APK）
  #
  # 关键点：
  #   - tag 计算和版本号注入都在 build-android 中完成（避免重复计算）
  #   - 通过 gh release create 创建的 tag 不会触发 push 事件，避免循环触发
  #   - 每次 git push 到 main 都会强制生成新版本：
  #     * APK 内的 AppConstants.appVersion 已被注入为 tag（去掉 v）
  #     * App 启动时比较 AppConstants.appVersion 与 latest release.tagName
  #     * 不同（latest 更大）→ 弹强制更新对话框（无"稍后"按钮）
  #     * 相同 → 跳过更新（已安装最新版本）
  auto-release:
    name: Auto Tag + Release
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - name: Verify tag from build-android
        env:
          NEXT_TAG: ${{ needs.build-android.outputs.next_tag }}
          VERSION: ${{ needs.build-android.outputs.version }}
        run: |
          echo "Tag from build-android: $NEXT_TAG"
          echo "Version from build-android: $VERSION"
          if [ -z "$NEXT_TAG" ]; then
            echo "ERROR: next_tag is empty, cannot create release"
            exit 1
          fi

      - name: Create tag + GitHub Release (with APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ needs.build-android.outputs.next_tag }}
        run: |
          # release body 包含：
          # 1. 本次具体修改内容（让用户知道更新了什么）
          # 2. 是否强制更新由 body 中是否含 [强制更新] 标记决定
          #    - 含标记 → UpdateDialog 仅显示"立即更新"按钮
          #    - 不含标记 → 可选更新，显示"立即更新" + "稍后"按钮
          # 本次为强制更新（body 含 [强制更新] 标记），用户必须更新后才能进入 App。
          cat > /tmp/release_notes.md << 'NOTES_EOF'
          [强制更新]

          ## 本次更新内容

          本次为强制更新，请立即更新到新版本后使用。

          ### 回退到稳定版本

          - 回退上一版本（v2026.1006.0）尝试的 IPv4 强制连接改动
            （实测在数据网络下反而无法正常使用）
          - 移除 main.dart 的 connectionFactory 强制 IPv4 连接
          - 移除 api_server_switcher.dart 的探测超时 5s→8s 与
            启动时镜像轮询回退逻辑
          - 恢复到上一可正常使用的稳定版本状态
          - 签名不变，可直接覆盖安装升级

          NOTES_EOF
          # 移除 heredoc 导致的每行前导空格（保持 markdown 结构）
          sed -i 's/^          //' /tmp/release_notes.md
          gh release create "$NEXT_TAG" artifacts/*.apk \
            --title "Release $NEXT_TAG" \
            --notes-file /tmp/release_notes.md \
            --latest

      - name: Verify release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ needs.build-android.outputs.next_tag }}
        run: |
          echo "Release $NEXT_TAG:"
          gh release view "$NEXT_TAG" --json url,name,tagName,createdAt -q '.' || true
